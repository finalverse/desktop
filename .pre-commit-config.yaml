repos:
  # The upstream hook only understands Linden's $LicenseInfo syntax. Preserve
  # those notices while accepting explicit SPDX notices on Finalverse sources.
  - repo: local
    hooks:
      - id: opensource-license
        name: Code Has Opensource License
        entry: python3 scripts/finalverse/check_source_license.py
        language: system
        types: [text]
        files: \.(cpp|c|h|py|glsl)$
  - repo: https://github.com/secondlife/git-hooks.git
    rev: v1.0.2
    hooks:
      - id: llsd
      - id: no-trigraphs
      - id: copyright
      - id: end-of-file
        files: \.(cpp|c|m|mm|h|py|glsl|cmake|txt)$
        exclude: language.txt
      - id: indent-with-spaces
        files: \.(cpp|c|m|mm|h|inl|py|glsl|cmake)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-xml
      - id: mixed-line-ending
      - id: trailing-whitespace
        files: \.(cpp|c|m|mm|h|inl|py|glsl|cmake|yaml|sh)$
